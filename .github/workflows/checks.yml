name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: mlx90640-pipeline demo --output outputs/demo --frames 80
      - run: python tools/audit_release.py
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[train,onnx]'
      - run: python -m unittest discover -s tests -v
      - run: python tools/smoke_training.py --output outputs/training_smoke
      - run: python tools/verify_model_release.py
